[package]
name = "kde-rust-mon"
version = "0.1.0"
edition = "2024"

[dependencies]
nvml-wrapper = "0.13"
ksni = "0.2"
anyhow = "1.0"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
