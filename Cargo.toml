[package]
name = "kde-rust-mon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
ksni = { version = "0.2", default-features = false }
nvml-wrapper = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
